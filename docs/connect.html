<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; navigate-to jarwis: https://github.com; base-uri 'none'; form-action 'none'">
  <title>Открыть Jarwis 1.0</title>
  <link rel="icon" href="jarvis-logo.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f5;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}main{width:min(100%,520px)}img{width:92px;height:92px;object-fit:contain}h1{font-size:34px;letter-spacing:0;margin:18px 0 10px}.lead{color:#b8b8b8;font-size:18px;line-height:1.5;margin:0 0 28px}.open{display:block;width:100%;padding:18px;border-radius:8px;background:#fff;color:#000;text-decoration:none;font-size:18px;font-weight:800}.download{display:inline-block;margin-top:22px;color:#aaa}.error{color:#ff9d9d}
  </style>
</head>
<body>
  <main>
    <img src="jarvis-logo.png" alt="Логотип Jarwis">
    <h1>Открываю Jarwis</h1>
    <p class="lead" id="status">Подтверди открытие приложения. Адрес и временный код будут введены автоматически.</p>
    <a class="open" id="open-app" href="#">Открыть Jarwis 1.0</a>
    <a class="download" href="https://github.com/Aslan171/jarwis-mobile/releases/latest/download/Jarwis.apk">Приложение не установлено? Скачать APK</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.hash.slice(1));
      const url = params.get("url") || "";
      const code = params.get("code") || "";
      const status = document.getElementById("status");
      const button = document.getElementById("open-app");
      let localAddress = false;
      try {
        const parsed = new URL(url);
        const octets = parsed.hostname.split(".").map(Number);
        const validIpv4 = octets.length === 4 && octets.every(value => Number.isInteger(value) && value >= 0 && value <= 255);
        const privateIpv4 = validIpv4 && (
          octets[0] === 10 ||
          (octets[0] === 172 && octets[1] >= 16 && octets[1] <= 31) ||
          (octets[0] === 192 && octets[1] === 168)
        );
        localAddress = parsed.protocol === "http:" && privateIpv4 && parsed.pathname === "/" && !parsed.search && !parsed.hash;
      } catch (_) {
        localAddress = false;
      }
      if (!localAddress || !/^\d{8}$/.test(code)) {
        status.textContent = "Ссылка подключения повреждена или уже недействительна. Создай новый QR-код на компьютере.";
        status.classList.add("error");
        button.hidden = true;
        return;
      }
      const deepLink = `jarwis://connect?url=${encodeURIComponent(url)}&code=${encodeURIComponent(code)}`;
      button.href = deepLink;
      setTimeout(() => { location.href = deepLink; }, 250);
    })();
  </script>
</body>
</html>
