name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarwis-release.jks"

      - name: Test and build signed APK
        env:
          JARWIS_KEYSTORE_PATH: ${{ runner.temp }}/jarwis-release.jks
          JARWIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JARWIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JARWIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk Jarwis.apk
          sha256sum Jarwis.apk > Jarwis.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Jarwis-Android
          path: |
            Jarwis.apk
            Jarwis.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          Jarwis.apk Jarwis.apk.sha256
          --title "Jarwis 1.0 for Android"
          --notes "Signed Android client for Jarwis 1.0. Android 8.0 or newer."

